<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>Renzos-Cave | Enter the world</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090c12; color: #e7e5df; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(620px, 100%); padding: clamp(24px, 6vw, 56px); border: 1px solid #59627388; border-radius: 20px; background: radial-gradient(ellipse at 80% 0%, #293943 0, #121721 48%, #0c1018 100%); box-shadow: 0 24px 90px #0008; }
    .eyebrow { color: #91b7bd; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(38px, 8vw, 64px); line-height: .98; }
    p { max-width: 48ch; color: #b9c0ca; line-height: 1.7; }
    a { display: inline-block; margin-top: 22px; padding: 13px 19px; border-radius: 8px; background: #d2a76b; color: #17120c; font-weight: 750; text-decoration: none; }
    a:hover { background: #edc489; }
    .note { margin-top: 22px; color: #858f9e; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Renzoverse · World one</div>
    <h1>Renzos-<br>Cave</h1>
    <p>A rough first doorway into Trog-Croman’s cave: a living 3D space driven by the CaveSharp simulation.</p>
    <a href="./game.html">Enter the cave</a>
    <div class="note">Start CaveSharp-OS first to see its live world telemetry.</div>
  </main>
</body>
</html>
