<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>Renzos-Cave | Trog-Croman</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #090c12;
      color: #e7e5df;
    }

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .hud {
      position: fixed;
      z-index: 2;
      top: 18px;
      left: 18px;
      width: min(300px, calc(100vw - 36px));
      padding: 16px;
      border: 1px solid #59627388;
      border-radius: 12px;
      background: #0c111bdc;
      box-shadow: 0 12px 40px #0008;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .eyebrow, .label {
      color: #9da8b9;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 { margin: 5px 0 14px; font-size: 20px; }
    .connection { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d7a54a; box-shadow: 0 0 12px currentColor; }
    .connection[data-state="live"] .dot { background: #70d6a2; }
    .connection[data-state="error"] .dot { background: #f27676; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { padding-top: 9px; border-top: 1px solid #ffffff1c; }
    .value { display: block; margin-top: 3px; font-size: 19px; font-variant-numeric: tabular-nums; }
    #directive { margin: 14px 0 0; color: #d7c49b; font-size: 12px; line-height: 1.45; }

    .hint {
      position: fixed;
      z-index: 2;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid #59627388;
      border-radius: 999px;
      background: #0c111bdc;
      color: #c2c8d2;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .hud { top: 10px; left: 10px; padding: 12px; }
      .hint { bottom: 10px; width: calc(100vw - 20px); border-radius: 12px; }
    }
  </style>
</head>
<body>
  <section class="hud" aria-live="polite">
    <div class="eyebrow">Renzos-Cave · Platonic gameworld</div>
    <h1>Trog-Croman</h1>
    <div id="connection" class="connection" data-state="connecting">
      <span class="dot" aria-hidden="true"></span>
      <span id="connectionText">Connecting to CaveSharp…</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">World threat</span><strong id="threat" class="value">—</strong></div>
      <div class="stat"><span class="label">Corruption</span><strong id="corruption" class="value">—</strong></div>
      <div class="stat"><span class="label">CTA aggression</span><strong id="cta" class="value">—</strong></div>
      <div class="stat"><span class="label">Creatures</span><strong id="creatures" class="value">—</strong></div>
      <div class="stat"><span class="label">Average hunger</span><strong id="hunger" class="value">—</strong></div>
    </div>
    <p id="directive">Waiting for the CaveSharp world pulse.</p>
  </section>
  <div class="hint">Click the world to look around · WASD to move · Shift to sprint · Esc to release the mouse</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const connection = document.querySelector('#connection');
    const connectionText = document.querySelector('#connectionText');
    const threatValue = document.querySelector('#threat');
    const corruptionValue = document.querySelector('#corruption');
    const ctaValue = document.querySelector('#cta');
    const creatureValue = document.querySelector('#creatures');
    const hungerValue = document.querySelector('#hunger');
    const directiveValue = document.querySelector('#directive');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#090c12');
    scene.fog = new THREE.FogExp2('#10131a', 0.025);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 120);
    const ambient = new THREE.HemisphereLight('#8294ae', '#17120f', 1.3);
    scene.add(ambient);

    const caveLight = new THREE.PointLight('#e9a85c', 95, 32, 2);
    caveLight.position.set(0, 2, -8);
    scene.add(caveLight);

    const fillLight = new THREE.PointLight('#5b8da4', 65, 24, 2);
    fillLight.position.set(-9, -1, 1);
    scene.add(fillLight);

    const caveGeometry = new THREE.SphereGeometry(27, 32, 20);
    const cavePositions = caveGeometry.attributes.position;
    for (let i = 0; i < cavePositions.count; i++) {
      const x = cavePositions.getX(i);
      const y = cavePositions.getY(i);
      const z = cavePositions.getZ(i);
      const roughness = 1 + 0.055 * Math.sin(x * 0.73 + z * 0.41) * Math.cos(y * 1.17 - z * 0.32);
      cavePositions.setXYZ(i, x * roughness, y * roughness, z * roughness);
    }
    caveGeometry.computeVertexNormals();
    const cave = new THREE.Mesh(
      caveGeometry,
      new THREE.MeshStandardMaterial({ color: '#34363a', roughness: 1, side: THREE.BackSide, flatShading: true })
    );
    cave.position.y = 3;
    scene.add(cave);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(19, 48),
      new THREE.MeshStandardMaterial({ color: '#262522', roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -4.5;
    scene.add(floor);

    const floorGrid = new THREE.GridHelper(38, 38, '#5a5142', '#48443d');
    floorGrid.position.y = -4.47;
    floorGrid.material.transparent = true;
    floorGrid.material.opacity = 0.22;
    scene.add(floorGrid);

    const rockMaterial = new THREE.MeshStandardMaterial({ color: '#55514a', roughness: 1, flatShading: true });
    for (let i = 0; i < 34; i++) {
      const angle = (i / 34) * Math.PI * 2;
      const radius = 9 + (i % 4) * 1.7;
      const height = 1.1 + (i % 7) * 0.42;
      const rock = new THREE.Mesh(
        new THREE.ConeGeometry(0.55 + (i % 3) * 0.18, height, 5 + (i % 3)),
        rockMaterial
      );
      rock.position.set(Math.cos(angle) * radius, -4.5 + height / 2, Math.sin(angle) * radius);
      rock.rotation.y = angle;
      rock.rotation.z = (i % 2 ? 1 : -1) * 0.12;
      scene.add(rock);
    }

    const crystalMaterial = new THREE.MeshStandardMaterial({
      color: '#79a9ac',
      emissive: '#285d69',
      emissiveIntensity: 1.4,
      roughness: 0.28,
      metalness: 0.1,
      flatShading: true
    });
    for (const [x, z, scale] of [[-5, -9, 1.5], [6, -11, 1.9], [-10, 3, 1.1], [10, 5, 1.4]]) {
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(scale, 0), crystalMaterial);
      crystal.position.set(x, -3.1, z);
      crystal.rotation.set(0.2, x * 0.1, 0.3);
      scene.add(crystal);
    }

    const trog = new THREE.Group();
    const bodyMaterial = new THREE.MeshStandardMaterial({ color: '#92704c', roughness: 0.85 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.85, 4, 8), bodyMaterial);
    body.position.y = 0.93;
    trog.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), bodyMaterial);
    head.position.y = 1.72;
    trog.add(head);
    const eyeMaterial = new THREE.MeshBasicMaterial({ color: '#ffd27a' });
    for (const x of [-0.12, 0.12]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), eyeMaterial);
      eye.position.set(x, 1.76, -0.3);
      trog.add(eye);
    }
    const legMaterial = new THREE.MeshStandardMaterial({ color: '#52402f', roughness: 1 });
    for (const x of [-0.2, 0.2]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.52, 7), legMaterial);
      leg.position.set(x, 0.25, 0);
      trog.add(leg);
    }
    trog.position.set(0, -4.5, 3);
    scene.add(trog);

    const creatureGroup = new THREE.Group();
    scene.add(creatureGroup);
    const creatureMaterial = new THREE.MeshStandardMaterial({
      color: '#80d5ac',
      emissive: '#23694c',
      emissiveIntensity: 1.3
    });
    const afraidMaterial = new THREE.MeshStandardMaterial({
      color: '#ff8b70',
      emissive: '#742b1c',
      emissiveIntensity: 1.3
    });
    const creatureMarkers = [];

    let threat = 0;
    let corruption = 0;
    let yaw = 0;
    let cameraYaw = 0;
    let pitch = 0;
    let cameraPitch = 0;
    const keys = new Set();
    const clock = new THREE.Clock();
    const moveDirection = new THREE.Vector3();
    const movementVelocity = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();
    const cameraLookTarget = new THREE.Vector3();

    function updateCreatures(creatures) {
      while (creatureMarkers.length < creatures.length) {
        const marker = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 1), creatureMaterial);
        creatureGroup.add(marker);
        creatureMarkers.push(marker);
      }
      creatureMarkers.forEach((marker, index) => {
        const creature = creatures[index];
        marker.visible = Boolean(creature);
        if (!creature) return;
        marker.position.set(
          THREE.MathUtils.clamp((Number(creature.x) || 0) * 0.35, -12, 12),
          -3.7,
          THREE.MathUtils.clamp((Number(creature.y) || 0) * 0.35, -12, 12)
        );
        marker.material = creature.isAfraid ? afraidMaterial : creatureMaterial;
        marker.scale.setScalar(0.8 + Math.max(0, Number(creature.aggression) || 0) / 100);
      });
    }

    function setConnection(state, message) {
      connection.dataset.state = state;
      connectionText.textContent = message;
    }

    function connectTelemetry() {
      const parameters = new URLSearchParams(window.location.search);
      const fallbackHost = window.location.hostname.replace(/-8000(?=\.|$)/, '-8181');
      const defaultProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const endpoint = parameters.get('telemetry') || `${defaultProtocol}//${fallbackHost}:8181/telemetry/`;
      setConnection('connecting', `Connecting to ${endpoint}`);

      let socket;
      try {
        socket = new WebSocket(endpoint);
      } catch (error) {
        setConnection('error', `Invalid telemetry URL: ${error.message}`);
        return;
      }

      socket.addEventListener('open', () => setConnection('live', 'CaveSharp telemetry live'));
      socket.addEventListener('message', (event) => {
        try {
          const state = JSON.parse(event.data);
          threat = Number(state.threat) || 0;
          corruption = Number(state.corruption) || 0;
          threatValue.textContent = threat.toFixed(0);
          corruptionValue.textContent = `${corruption.toFixed(1)}%`;
          ctaValue.textContent = `${(Number(state.cta) || 0).toFixed(0)}%`;
          const creatures = Array.isArray(state.creatures) ? state.creatures : [];
          creatureValue.textContent = creatures.length.toString();
          const hungerLevels = creatures
            .map((creature) => creature.hunger)
            .filter((hunger) => typeof hunger === 'number' && Number.isFinite(hunger));
          hungerValue.textContent = hungerLevels.length
            ? `${(hungerLevels.reduce((total, hunger) => total + hunger, 0) / hungerLevels.length).toFixed(0)}%`
            : '—';
          directiveValue.textContent = `${state.ctaBoss || 'CaveSharp'}: ${state.directive || 'No active directive'}`;
          updateCreatures(creatures);
        } catch (error) {
          setConnection('error', `Could not read CaveSharp telemetry: ${error.message}`);
          socket.close();
        }
      });
      socket.addEventListener('close', () => {
        setConnection('connecting', 'CaveSharp disconnected · retrying…');
        window.setTimeout(connectTelemetry, 2000);
      });
      socket.addEventListener('error', () => setConnection('error', 'Telemetry unavailable · retrying…'));
    }
    connectTelemetry();

    renderer.domElement.addEventListener('click', () => {
      if (document.pointerLockElement !== renderer.domElement)
        renderer.domElement.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      renderer.domElement.style.cursor = document.pointerLockElement === renderer.domElement ? 'none' : 'crosshair';
    });
    document.addEventListener('mousemove', (event) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      yaw -= event.movementX * 0.002;
      pitch = THREE.MathUtils.clamp(pitch - event.movementY * 0.0015, -0.35, 0.35);
    });
    document.addEventListener('keydown', (event) => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(event.code)) {
        keys.add(event.code);
        event.preventDefault();
      }
    });
    document.addEventListener('keyup', (event) => keys.delete(event.code));
    window.addEventListener('blur', () => keys.clear());
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      const turnSmoothing = 1 - Math.exp(-12 * delta);
      const followSmoothing = 1 - Math.exp(-7 * delta);
      const movementSmoothing = 1 - Math.exp(-10 * delta);
      const isMoving = keys.has('KeyW') || keys.has('KeyA') ||
        keys.has('KeyS') || keys.has('KeyD');
      const isSprinting = isMoving && (keys.has('ShiftLeft') || keys.has('ShiftRight'));

      cameraYaw += Math.atan2(Math.sin(yaw - cameraYaw), Math.cos(yaw - cameraYaw)) * turnSmoothing;
      cameraPitch += (pitch - cameraPitch) * turnSmoothing;

      const forwardX = -Math.sin(cameraYaw);
      const forwardZ = -Math.cos(cameraYaw);
      const rightX = Math.cos(cameraYaw);
      const rightZ = -Math.sin(cameraYaw);
      moveDirection.set(0, 0, 0);
      if (keys.has('KeyW')) { moveDirection.x += forwardX; moveDirection.z += forwardZ; }
      if (keys.has('KeyS')) { moveDirection.x -= forwardX; moveDirection.z -= forwardZ; }
      if (keys.has('KeyA')) { moveDirection.x -= rightX; moveDirection.z -= rightZ; }
      if (keys.has('KeyD')) { moveDirection.x += rightX; moveDirection.z += rightZ; }
      if (moveDirection.lengthSq() > 0) moveDirection.normalize();

      const speed = isSprinting ? 6.2 : 3.8;
      movementVelocity.x += (moveDirection.x * speed - movementVelocity.x) * movementSmoothing;
      movementVelocity.z += (moveDirection.z * speed - movementVelocity.z) * movementSmoothing;
      trog.position.x += movementVelocity.x * delta;
      trog.position.z += movementVelocity.z * delta;

      const previousX = trog.position.x;
      const previousZ = trog.position.z;
      trog.position.x = THREE.MathUtils.clamp(trog.position.x, -15, 15);
      trog.position.z = THREE.MathUtils.clamp(trog.position.z, -15, 15);
      if (trog.position.x !== previousX) movementVelocity.x = 0;
      if (trog.position.z !== previousZ) movementVelocity.z = 0;

      trog.rotation.y += Math.atan2(
        Math.sin(cameraYaw - trog.rotation.y),
        Math.cos(cameraYaw - trog.rotation.y)
      ) * turnSmoothing;
      const stride = Math.min(movementVelocity.length() / 3.8, 1);
      trog.position.y = -4.5 + Math.sin(elapsed * (isSprinting ? 13 : 9)) * 0.035 * stride;

      cameraTarget.set(
        trog.position.x - forwardX * 4.5,
        trog.position.y + 2.3,
        trog.position.z - forwardZ * 4.5
      );
      camera.position.lerp(cameraTarget, followSmoothing);
      cameraLookTarget.set(
        trog.position.x + forwardX * 3,
        trog.position.y + 1.5 + cameraPitch * 5,
        trog.position.z + forwardZ * 3
      );
      camera.lookAt(cameraLookTarget);

      const danger = THREE.MathUtils.clamp(threat / 150, 0, 1);
      caveLight.color.setHSL(0.1 - danger * 0.09, 0.65, 0.58);
      caveLight.intensity = 80 + Math.min(corruption, 100) * 0.45;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
